body{background:var(--bg) var(--pattern) repeat;background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px;display:flex;flex-direction:column;gap:22px}

.headwrap{position:relative;z-index:1}
.card{background:color-mix(in srgb,var(--bg) 88%,transparent);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.lede{margin:6px 0 0;color:var(--muted);max-width:60ch}

.picker{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.picker label{font-weight:700}
#town{font:inherit;font-size:19px;padding:10px 14px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);min-width:0;flex:1 1 240px;max-width:360px}
#town:focus{outline:none;border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:inherit;font-size:14px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.chips button:hover,.chips button:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}
.err{color:#b4442f;font-size:15px;min-height:1em;margin:0}

.headline{font-family:var(--display);font-weight:400;font-size:clamp(22px,4.6vw,30px);line-height:1.25;margin:0;text-wrap:balance}
.headline em{font-style:normal;color:var(--accent)}
.sub{margin:4px 0 0;color:var(--muted);font-size:15px}

.street{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.street svg{display:block;width:100%;height:auto}
.street svg .p{transition:opacity .2s}
.street.focus svg .p{opacity:var(--dim)}
.street.focus svg .p.on{opacity:1}

.list{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.list li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:8px 10px;border-radius:10px;cursor:pointer}
.list li:hover,.list li:focus-visible,.list li.on{background:var(--surface);outline:none}
.big{font-family:var(--display);font-size:30px;line-height:1;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.who{min-width:0}
.who b{font-weight:700}
.who small{display:block;color:var(--muted);font-size:14px}
.dots{display:flex;flex-wrap:wrap;gap:2px;max-width:150px;justify-content:flex-start}
.dots i{width:8px;height:8px;border-radius:50%;display:block}
@media (max-width:520px){.dots{display:none}}

.note{font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;max-width:70ch}
@media (prefers-reduced-motion:reduce){.street svg .p{transition:none}}

  {n:"ישראל ביתנו", c:"#a8325a"},
  {n:"רע״מ", c:"#3a8a3c"},
  {n:"עוצמה יהודית", c:"#e08a3c"},
  {n:"יהדות התורה", c:"#8c6a45"},
  {n:"ש״ס", c:"#7a59b5"},
  {n:"הציונות הדתית", c:"#e3b52f"},
  {n:"המילואימניקים", c:"#8aa0bf"},
  {n:"עמך ישראל (וינטר)", c:"#9bcf4c"},
  {n:"מפלגות קטנות אחרות", c:"#aaa59a"},
];
const byName = new Map(DATA.map(d=>[d[0],d]));
const NAT = DATA[0];
const le = n => "ל" + (n.startsWith("ה") ? n.slice(1) : n);
const fmt = n => n.toLocaleString("he-IL");

// Round shares to whole people that add up to exactly 100 (largest remainder)
function to100(counts){
  const tot = counts.reduce((a,b)=>a+b,0);
  if(!tot) return counts.map(()=>0);
  const raw = counts.map(c=>c*100/tot);
  const fl = raw.map(Math.floor);
  let left = 100 - fl.reduce((a,b)=>a+b,0);
  raw.map((r,i)=>[r-fl[i],i]).sort((a,b)=>b[0]-a[0]).slice(0,left).forEach(([,i])=>fl[i]++);
  return fl;
}

// ----- picker -----
const dl = document.getElementById("towns");
dl.innerHTML = DATA.map(d=>`<option value="${d[0]}"></option>`).join("");
const chipNames = ["כל הארץ","ירושלים","תל אביב  יפו".replace(/\s+/g," "),"חיפה","בני ברק","באר שבע","צור הדסה"];
document.getElementById("chips").innerHTML = chipNames.filter(n=>byName.has(n))
  .map(n=>`<button type="button" data-t="${n}">${n}</button>`).join("");
document.getElementById("chips").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  input.value=b.dataset.t; show(b.dataset.t);
});
const input = document.getElementById("town");
const norm = s => s.trim().replace(/\s+/g," ").replace(/[-־]/g," ");
function findTown(q){
  q = norm(q); if(!q) return null;
  for(const d of DATA) if(norm(d[0])===q) return d;
  const hits = DATA.filter(d=>norm(d[0]).includes(q));
  return hits.length===1 ? hits[0] : null;
}
input.addEventListener("change",()=>tryShow());
input.addEventListener("keydown",e=>{ if(e.key==="Enter") tryShow(); });
function tryShow(){
  const d = findTown(input.value);
  const err = document.getElementById("err");
  if(!d){ err.textContent = input.value.trim() ? "לא מצאנו את הישוב הזה. נסו לבחור מהרשימה שנפתחת כשמקלידים." : ""; return; }
  err.textContent=""; input.value=d[0]; show(d[0]);
}

// ----- street drawing -----
const streetEl = document.getElementById("street");
let current = null, focusIdx = null;

function personSVG(x,y,s,color,cls){
  // simple figure: head + rounded body, standing on (x,y) feet
  const h = s*0.34, bw = s*0.58, bh = s*0.52;
  return `<g class="p ${cls}"><circle cx="${x}" cy="${y-bh-h*0.95}" r="${h*0.5}" fill="${color}"/>`+
         `<rect x="${x-bw/2}" y="${y-bh}" width="${bw}" height="${bh}" rx="${bw*0.42}" fill="${color}"/></g>`;
}

function drawStreet(people){
  // people: array of 100 party indices, already grouped
  const narrow = streetEl.clientWidth < 620;
  const perRow = narrow ? 5 : 10;            // houses per street row
  const rows = 10 / perRow;
  const W = perRow*100, rowH = 150, H = rows*rowH + 6;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="רחוב עם 100 שכנים בצבעי המפלגות">`;
  for(let r=0;r<rows;r++){
    const top = r*rowH;
    s += `<rect x="0" y="${top}" width="${W}" height="${rowH}" fill="var(--sky)"/>`;
    s += `<circle cx="${W-40}" cy="${top+22}" r="12" fill="var(--sun)"/>`;
    s += `<g fill="var(--cloud)" opacity=".85"><ellipse cx="${W*0.45}" cy="${top+18}" rx="26" ry="7"/><ellipse cx="${W*0.45+16}" cy="${top+13}" rx="14" ry="7"/></g>`;
    s += `<rect x="0" y="${top+rowH-16}" width="${W}" height="16" fill="var(--road)"/>`;
    for(let x=W/perRow; x<W; x+=W/perRow*2){ s += `<g fill="var(--tree)"><ellipse cx="${x}" cy="${top+62}" rx="9" ry="12"/></g><rect x="${x-1.5}" y="${top+70}" width="3" height="14" fill="var(--house-edge)"/>`; }
    for(let k=0;k<perRow;k++){
      const hIdx = r*perRow + k;
      const x0 = W - (k+1)*100 + 8;           // right-to-left
      const hh = 46 + ((hIdx*37)%3)*8;         // slight height variety
      const hy = top + 58 - (hh-46);
      s += `<rect x="${x0+6}" y="${hy}" width="72" height="${hh}" fill="var(--house)" stroke="var(--house-edge)" stroke-width="1.5"/>`;
      s += `<path d="M${x0} ${hy+2} L${x0+42} ${hy-20} L${x0+84} ${hy+2} Z" fill="var(--roof)"/>`;
      s += `<rect x="${x0+34}" y="${hy+hh-22}" width="16" height="22" fill="var(--house-edge)"/>`;
      s += `<rect x="${x0+16}" y="${hy+12}" width="12" height="11" fill="var(--sky)"/><rect x="${x0+56}" y="${hy+12}" width="12" height="11" fill="var(--sky)"/>`;
      // 10 neighbors in front of the house: 2 rows of 5
      for(let j=0;j<10;j++){
        const pi = people[hIdx*10+j];
        if(pi===undefined) continue;
        const col = 4-(j%5), line = Math.floor(j/5);
        const px = x0 + 10 + col*16 + (line?8:0);
        const py = top + rowH - 18 - (line?0:22);
        s += personSVG(px, py, 17, PARTIES[pi].c, "p"+pi);
      }
    }
  }
  s += `</svg>`;
  streetEl.innerHTML = s;
  applyFocus();
}

function applyFocus(){
  streetEl.classList.toggle("focus", focusIdx!==null);
  streetEl.querySelectorAll(".p").forEach(g=>g.classList.toggle("on", focusIdx!==null && g.classList.contains("p"+focusIdx)));
  document.querySelectorAll("#list li").forEach(li=>li.classList.toggle("on", +li.dataset.i===focusIdx));
}

// ----- main view -----
function show(name){
  const d = byName.get(name); if(!d) return;
  current = d; focusIdx = null;
  const [tName, elig, voters, valid, counts] = d;
  const isNat = tName==="כל הארץ";
  const n100 = to100(counts), nat100 = to100(NAT[4]);
  const order = counts.map((c,i)=>i).filter(i=>i!==13).sort((a,b)=>counts[b]-counts[a]);
  order.push(13);
  const people = []; order.forEach(i=>{ for(let k=0;k<n100[i];k++) people.push(i); });

  const top = order[0];
  document.getElementById("headline").innerHTML = isNat
    ? `אם כל ישראל הייתה רחוב של 100 מצביעים, <em>${n100[top]}</em> מהם היו מצביעים ${le(PARTIES[top].n)}.`
    : `ב${tName}, מתוך כל 100 שכנים שהצביעו, <em>${n100[top]}</em> הצביעו ${le(PARTIES[top].n)}.`;
  const turnout = elig ? Math.round(voters*100/elig) : 0;
  document.getElementById("sub").textContent =
    `בפועל הצביעו ${isNat?"בכל הארץ":"כאן"} ${fmt(valid)} אנשים. מכל 100 בעלי זכות בחירה, ${turnout} הגיעו לקלפי.`;

  drawStreet(people);

  const list = document.getElementById("list");
  list.innerHTML = order.filter(i=>counts[i]>0).map(i=>{
    const k = n100[i];
    const big = k>0 ? k : "<1";
    const cmp = isNat ? "" : `<small>בכל הארץ: ${nat100[i]} מתוך 100</small>`;
    const lead = k>0 ? `${k===1?"שכן אחד":k+" שכנים"} מתוך 100` : "פחות משכן אחד מתוך 100";
    const dots = Array.from({length:k},()=>`<i style="background:${PARTIES[i].c}"></i>`).join("");
    return `<li tabindex="0" data-i="${i}"><span class="big" style="color:${PARTIES[i].c}">${big}</span>`+
      `<span class="who"><b>${PARTIES[i].n}</b> · ${lead}${cmp}</span><span class="dots" aria-hidden="true">${dots}</span></li>`;
  }).join("");

  const note = document.getElementById("note");
  note.textContent = valid < 300
    ? `שימו לב: ב${tName} הצביעו רק ${fmt(valid)} אנשים, אז "100 שכנים" כאן הם הגדלה של קבוצה קטנה. התמונה נכונה, אבל כל שכן ברחוב מייצג פחות מאדם אחד אמיתי.`
    : `איך זה עובד: לקחנו את כל הקולות הכשרים בישוב והקטנו אותם לרחוב של 100 אנשים, בלי לשנות את היחס בין המפלגות. כל דמות ברחוב היא 1 מכל 100 מצביעים. מקור: תוצאות ועדת הבחירות המרכזית לפי ישוב (ללא מעטפות כפולות של חיילים וכדומה, שלא שויכו לישוב).`;
  try{ localStorage.setItem("town", tName); }catch(e){}
}

document.getElementById("list").addEventListener("click",e=>{
  const li=e.target.closest("li"); if(!li) return;
  const i=+li.dataset.i; focusIdx = focusIdx===i ? null : i; applyFocus();
});
document.getElementById("list").addEventListener("keydown",e=>{
  if(e.key==="Enter"||e.key===" "){ e.preventDefault(); e.target.click(); }
});
let rw; new ResizeObserver(()=>{ clearTimeout(rw); rw=setTimeout(()=>current&&show(current[0]),120); }).observe(streetEl);

let start = "צור הדסה";
try{ const s=localStorage.getItem("town"); if(s && byName.has(s)) start=s; }catch(e){}
if(!byName.has(start)) start="כל הארץ";
input.value = start; show(start);
</script>

</body>
